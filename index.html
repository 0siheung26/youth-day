<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 제5회 시흥 청년의 날 부스 방문자 집계</title>
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F5F7FA;
      --card-bg: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #1A252C;
    }
    .header p {
      font-size: 0.9rem;
      color: #666;
      margin: 0;
    }
    .booth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .booth-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .booth-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .count-badge {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
    }
    .btn-open-modal {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
    }
    .btn-open-modal:active {
      opacity: 0.85;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .form-group input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #DDD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cat-btn {
      padding: 10px 6px;
      border: 1px solid #E0E0E0;
      background: #F9F9F9;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
    }
    .cat-btn.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: bold;
    }
    .privacy-box {
      background: #F8F9FA;
      border: 1px solid #E9ECEF;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.75rem;
      color: #555;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .privacy-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .btn-submit {
      flex: 2;
      background: #28A745;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      background: #6C757D;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>2026 제5회 시흥 청년의 날</h1>
    <p>부스 방문객 명부 등록 시스템</p>
  </div>

  <div class="booth-grid" id="boothGrid">
    <div style="text-align:center; grid-column: 1/-1; padding: 40px; color: #888;">
      데이터를 불러오는 중입니다...
    </div>
  </div>

  <!-- 입력 모달 팝업 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header" id="modalBoothTitle">부스 정보</div>
      
      <div class="form-group">
        <label for="userName">방문자 이름 <span style="color:red;">*</span></label>
        <input type="text" id="userName" placeholder="이름을 입력해 주세요">
      </div>

      <div class="form-group">
        <label>성별 / 연령대 선택 <span style="color:red;">*</span></label>
        <div class="category-grid">
          <button type="button" class="cat-btn" onclick="selectCategory(this, '20미만(남)')">20미만(남)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '20미만(여)')">20미만(여)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '20-24(남)')">20-24(남)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '20-24(여)')">20-24(여)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '25-39(남)')">25-39(남)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '25-39(여)')">25-39(여)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '39초과(남)')">39초과(남)</button>
          <button type="button" class="cat-btn" onclick="selectCategory(this, '39초과(여)')">39초과(여)</button>
        </div>
      </div>

      <div class="privacy-box">
        <strong>[개인정보 수집 및 이용 동의 안내]</strong><br>
        • 수집·이용 목적: 2026 제5회 청년의 날 기념행사 방문객 집계<br>
        • 수집 항목: 이름, 성별, 연령대<br>
        • 보유 및 이용 기간: 행사 종료 및 성과 보고 완료 후 90일 이내 파기<br>
        * 동의를 거부할 수 있으나, 거부 시 이벤트 참여가 제한될 수 있습니다.
      </div>

      <div class="privacy-checkbox">
        <input type="checkbox" id="privacyAgree">
        <label for="privacyAgree">개인정보 수집 및 이용에 동의합니다.</label>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-submit" onclick="submitData()">등록하기</button>
      </div>
    </div>
  </div>

  <script>
    // 방금 발급해주신 최신 GAS 웹 앱 URL 반영
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx7K2-pcqW-SuSGLIBpH9QxNE4QPr-O6azqh_-VQRMEn0qrw6wnFUQUL_ftkA4Fck43sg/exec";
    
    const booths = [
      "1. 청년정책플러스", "2. 시흥청년협의체", "3. 청년스테이션", "4. 청년예술가",
      "5. 청년창업지원", "6. 일자리센터", "7. 마음건강상담", "8. 청년협동조합",
      "9. 시흥청년네트워크", "10. 청년문화마을", "11. 청소년재단", "12. 시흥시의회",
      "13. 대학생기획단", "14. 청년공동체", "15. 사회적기업", "16. 시흥창업센터",
      "17. 지역활력소", "18. 청년동아리A", "19. 청년동아리B", "20. 청년동아리C",
      "21. 스타트업Zone", "22. 핸드메이드마켓A", "23. 핸드메이드마켓B", "24. 체험부스1",
      "25. 체험부스2", "26. 체험부스3", "27. 체험부스4", "28. 푸드트럭Zone1",
      "29. 푸드트럭Zone2", "30. 포토존", "31. 이벤트Zone", "32. 상담Zone",
      "33. 청년농부", "34. 로컬크리에이터", "35. 환경캠페인", "36. 서포터즈",
      "37. 시흥시청소년수련관", "38. 정왕청소년문화의집", "39. 목감청소년문화의집", "40. 배곧청소년문화의집",
      "41. 신천청소년문화의집", "42. 능곡청소년문화의집", "43. 군자동청소년문화의집", "44. 월곶청소년문화의집",
      "45. 과림청소년문화의집", "46. 운영본부", "47. 의료지원단"
    ];

    let currentBooth = "";
    let selectedCategory = "";
    let boothCounts = {};

    function init() {
      booths.forEach(b => boothCounts[b] = 0);
      fetchCounts();
    }

    function fetchCounts() {
      // 2초 후 무조건 강제 화면 출력 (로딩 멈춤 방지 안전장치)
      const forceRenderTimer = setTimeout(() => {
        renderGrid();
      }, 2000);

      fetch(GAS_URL)
        .then(res => res.json())
        .then(res => {
          clearTimeout(forceRenderTimer);
          if (res.result === "success" && Array.isArray(res.data)) {
            booths.forEach(b => boothCounts[b] = 0);
            const data = res.data;
            for (let i = 1; i < data.length; i++) {
              const boothName = data[i][1];
              if (boothCounts[boothName] !== undefined) {
                boothCounts[boothName]++;
              }
            }
          }
          renderGrid();
        })
        .catch(err => {
          clearTimeout(forceRenderTimer);
          console.error("데이터 로딩 중 예외 발생:", err);
          renderGrid();
        });
    }

    function renderGrid() {
      const grid = document.getElementById("boothGrid");
      grid.innerHTML = "";
      booths.forEach(booth => {
        const card = document.createElement("div");
        card.className = "booth-card";
        card.innerHTML = `
          <div>
            <div class="booth-title">${booth}</div>
            <div class="count-badge">누적 방문: <strong>${boothCounts[booth]}</strong>명</div>
          </div>
          <button class="btn-open-modal" onclick="openModal('${booth}')">방문자 등록</button>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(boothName) {
      currentBooth = boothName;
      selectedCategory = "";
      document.getElementById("modalBoothTitle").innerText = `[${boothName}] 방문 등록`;
      document.getElementById("userName").value = "";
      document.getElementById("privacyAgree").checked = false;
      
      document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("selected"));
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    function selectCategory(btn, category) {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedCategory = category;
    }

    function submitData() {
      const name = document.getElementById("userName").value.trim();
      const agree = document.getElementById("privacyAgree").checked;

      if (!name) {
        alert("이름을 입력해 주세요.");
        return;
      }
      if (!selectedCategory) {
        alert("성별/연령대를 선택해 주세요.");
        return;
      }
      if (!agree) {
        alert("개인정보 수집 및 이용 동의에 체크해 주세요.");
        return;
      }

      const payload = {
        boothName: currentBooth,
        userName: name,
        category: selectedCategory,
        agreed: agree
      };

      // 화면에 반영 후 모달 닫기
      boothCounts[currentBooth]++;
      renderGrid();
      closeModal();

      // 구글 시트로 데이터 전송
      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => {
        console.error("데이터 전송 오류:", err);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
