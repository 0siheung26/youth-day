        .count-info { font-size: 0.95rem; color: #374151; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .count-display { font-size: 1.5rem; color: #2563eb; font-weight: bold; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; width: 100%; transition: background-color 0.2s; }
        button:active { background-color: #1d4ed8; }

                    { group: "5. 시흥시정신건강복지센터", name: "내마음 알아보기: 우울 자가진단 및 마음돌봄부스" },

            },
            {
                category: "🖼️ 전시존",
                items: [
                    { group: "상가(1071) | 경기과학기술대학교 '잔상'", name: "경기과학기술대학교 '잔상' 동아리 전시" },
                    { group: "상가(1137) | 청년문화예술지원사업_우리들의 별(북페어)", name: "우리들의 별" },
                    { group: "가로상점1 | 레코더즈", name: "좋아하는 순간을 사진으로 기록하는 사람들, 레코더즈" },
                    { group: "가로상점2 | 청년문화예술지원사업_아트플리마켓", name: "아트플리마켓" },
                    { group: "가로상점3 | 작업할건대학교 시흥", name: "작업할건대학교 시흥 아트 예술상점 2호" },
                    { group: "가로상점4 | 작업할건대학원 시흥", name: "작업할건대학원 시흥 아트 예술상점 1호" }
                ]
            }
        ];

        let currentCounts = {};

        async function fetchCounts() {
            try {
                const response = await fetch(SCRIPT_URL);
                currentCounts = await response.json();
                renderBooths();
            } catch (e) {
                console.error("데이터 로딩 실패", e);
            }
        }

        function renderBooths() {
            const listDiv = document.getElementById("booth-list");
            listDiv.innerHTML = "";

            boothData.forEach(cat => {
                const catHeader = document.createElement("div");
                catHeader.className = "category-title";
                catHeader.innerText = cat.category;
                listDiv.appendChild(catHeader);

                cat.items.forEach(booth => {
                    const countKey = `${booth.group} - ${booth.name}`;
                    const count = currentCounts[countKey] || 0;

                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="group-name">${booth.group}</div>
                        <div class="booth-name">${booth.name}</div>
                        <div class="count-info">
                            <span>현재 참여 인원</span>
                            <span class="count-display">${count}명</span>
                        </div>
                        <button onclick="addParticipant('${countKey}', this)">방문 카운트 +1</button>
                    `;
                    listDiv.appendChild(card);
                });
            });
        }

        async function addParticipant(boothKey, btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = "기록 중...";

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ boothName: boothKey })
                });
            } catch (e) {
                alert("기록 중 오류가 발생했습니다.");
            } finally {
                fetchCounts();
            }
        }

        fetchCounts();
    </script>
</body>
</html>
